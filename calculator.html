<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #eef1f5;
      transition: 0.3s;
    }

    body.dark {
      background: #111827;
    }

    .calculator {
      width: 350px;
      max-width: 94%;
      padding: 22px;
      border-radius: 25px;
      background: white;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    body.dark .calculator {
      background: #1f2937;
      color: white;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 15px;
    }

    .theme {
      border: none;
      background: none;
      font-size: 22px;
      cursor: pointer;
    }

    #display {
      width: 100%;
      height: 75px;
      border: none;
      border-radius: 15px;
      background: #f3f4f6;
      text-align: right;
      padding: 15px;
      font-size: 32px;
      margin-bottom: 15px;
    }

    body.dark #display {
      background: #111827;
      color: white;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      cursor: pointer;
      background: #e5e7eb;
      transition: transform 0.1s;
    }

    button:active {
      transform: scale(0.94);
    }

    .operator {
      background: #dbeafe;
    }

    .equal {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #fee2e2;
    }

    .history {
      margin-top: 20px;
      max-height: 130px;
      overflow-y: auto;
    }

    .history h3 {
      margin-bottom: 8px;
    }

    .history-item {
      padding: 7px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    .clear-history {
      width: 100%;
      height: 40px;
      margin-top: 8px;
      font-size: 14px;
    }

    @media (max-width: 400px) {
      .calculator {
        padding: 15px;
      }

      button {
        height: 52px;
      }
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="top">
      <h1>🧮 Pro Calculator</h1>
      <button class="theme" onclick="toggleTheme()">🌙</button>
    </div>

    <input id="display" type="text" value="0" readonly>

    <div class="buttons">

      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="percent()">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="number('7')">7</button>
      <button onclick="number('8')">8</button>
      <button onclick="number('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="number('4')">4</button>
      <button onclick="number('5')">5</button>
      <button onclick="number('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="number('1')">1</button>
      <button onclick="number('2')">2</button>
      <button onclick="number('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button onclick="number('0')">0</button>
      <button onclick="decimal()">.</button>
      <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="history">
      <h3>History</h3>
      <div id="historyList"></div>
      <button class="clear-history" onclick="clearHistory()">
        Clear History
      </button>
    </div>

  </div>

  <script>
    let display = document.getElementById("display");
    let firstNumber = null;
    let operator = null;
    let waitingForSecond = false;

    function number(num) {
      if (display.value === "0" || waitingForSecond) {
        display.value = num;
        waitingForSecond = false;
      } else {
        display.value += num;
      }
    }

    function decimal() {
      if (waitingForSecond) {
        display.value = "0.";
        waitingForSecond = false;
        return;
      }

      if (!display.value.includes(".")) {
        display.value += ".";
      }
    }

    function chooseOperator(op) {
      firstNumber = Number(display.value);
      operator = op;
      waitingForSecond = true;
    }

    function calculate() {
      if (operator === null || firstNumber === null) return;

      let secondNumber = Number(display.value);
      let result;

      if (operator === "+") {
        result = firstNumber + secondNumber;
      } else if (operator === "-") {
        result = firstNumber - secondNumber;
      } else if (operator === "*") {
        result = firstNumber * secondNumber;
      } else if (operator === "/") {
        if (secondNumber === 0) {
          display.value = "Error";
          return;
        }
        result = firstNumber / secondNumber;
      }

      let expression =
        firstNumber + " " + operator + " " + secondNumber + " = " + result;

      display.value = result;
      addHistory(expression);

      firstNumber = null;
      operator = null;
      waitingForSecond = true;
    }

    function clearDisplay() {
      display.value = "0";
      firstNumber = null;
      operator = null;
      waitingForSecond = false;
    }

    function deleteLast() {
      if (display.value.length > 1) {
        display.value = display.value.slice(0, -1);
      } else {
        display.value = "0";
      }
    }

    function percent() {
      display.value = Number(display.value) / 100;
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
    }

    function addHistory(text) {
      let history = document.getElementById("historyList");

      let item = document.createElement("div");
      item.className = "history-item";
      item.textContent = text;

      history.prepend(item);
    }

    function clearHistory() {
      document.getElementById("historyList").innerHTML = "";
    }

    document.addEventListener("keydown", function(event) {

      if (!isNaN(event.key)) {
        number(event.key);
      }

      if (event.key === ".") {
        decimal();
      }

      if (["+", "-", "*", "/"].includes(event.key)) {
        chooseOperator(event.key);
      }

      if (event.key === "Enter" || event.key === "=") {
        calculate();
      }

      if (event.key === "Backspace") {
        deleteLast();
      }

      if (event.key === "Escape") {
        clearDisplay();
      }

    });
  </script>

</body>
</html>
